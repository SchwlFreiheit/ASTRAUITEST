name: Temporary fetch ChatGPT share source

on:
  push:
    paths:
      - '.github/workflows/fetch-share-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch shared conversation HTML
        shell: bash
        run: |
          set -euo pipefail
          URL='https://chatgpt.com/share/6a991bd2-11c4-83ee-a94e-ba44dbea5852'
          curl -L --fail --retry 3 --retry-all-errors \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: ja,en-US;q=0.9,en;q=0.8' \
            "$URL" -o share.html
          echo "bytes=$(wc -c < share.html)"
          grep -o '6a991bd2-11c4-83ee-a94e-ba44dbea5852' share.html | head -1 || true
      - name: Upload raw HTML
        uses: actions/upload-artifact@v4
        with:
          name: share-source
          path: share.html
          retention-days: 1
